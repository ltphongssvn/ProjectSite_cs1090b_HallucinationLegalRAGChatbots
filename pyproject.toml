[project]
name = "projectsite-cs1090b-hallucinationlegalragchatbots"
version = "0.1.0"
description = "Project website for CS1090B: Reducing Hallucination in Legal RAG Chatbots — Next.js frontend + FastAPI backend"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "detect-secrets>=1.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
